app-id: org.linux_hardware.hw-probe
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: hw-probe
finish-args:
  - --share=network
  - --device=all
  - --filesystem=host:ro
  - --filesystem=/var/log:ro
  - --filesystem=/sys:ro
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --env=PATH=/usr/bin:/bin:/usr/sbin:/sbin:/app/bin:/app/sbin
  - --env=PERL5LIB=/app/share/perl5:/app/lib/x86_64-linux-gnu/perl-base:/app/lib/i386-linux-gnu/perl-base
  - --env=LD_LIBRARY_PATH=/app/lib/x86_64-linux-gnu/:/app/lib/i386-linux-gnu/:/app/lib64:/app/lib
  - --env=LC_ALL=C
cleanup:
  - /include
  - /man
  - /share/doc
  - /share/man
  - /share/hwinfo
  - /share/pkgconfig
  - /share/usb.ids.gz
  - /share/smartmontools
  - /share/smartd.service
  - /share/PERL5_BASE
  - /share/automake*
  - /share/info
  - /share/aclocal*
  - /share/libtool
  - /sbin/check_hd
  - /sbin/convert_hd
  - /sbin/fancontrol
  - /sbin/getsysinfo
  - /sbin/isadump
  - /sbin/isaset
  - /sbin/mk_isdnhwdb
  - /sbin/ownership
  - /sbin/pwmconfig
  - /sbin/sensors-detect
  - /sbin/setpci
  - /sbin/update-pciids
  - /sbin/update-usbids.sh
  - /sbin/vpddecode
  - /sbin/smartd
  - /sbin/update-smart-drivedb
  - /lib64/pkgconfig
  - /lib/pkgconfig
  - /lib/libltdl*
  - /bin/acpibin
  - /bin/acpiexamples
  - /bin/acpiexec
  - /bin/acpihelp
  - /bin/acpinames
  - /bin/acpisrc
  - /bin/kmod
  - /bin/lsusb.py
  - /bin/sensors-conf-convert
  - /bin/usbhid-dump
  - /bin/lex
  - /bin/automake*
  - /bin/aclocal*
  - /bin/libtool*
  - /etc/init.d
  - /etc/smartd_warning.d
  - /etc/sensors.d
  - /etc/smartd.conf
  - /etc/smartd_warning.sh
  - /var/lib
  - /lib/*.a
  - /lib/*.la
  - /usr
modules:
  - name: automake
    buildsystem: simple
    build-commands:
      - ./configure --prefix=$FLATPAK_DEST
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/automake/automake-1.17.tar.xz
        sha256: 8920c1fc411e13b90bf704ef9db6f29d540e76d232cb3b2c9f4dc4cc599bd990
  - name: libtool
    buildsystem: simple
    build-commands:
      - ./configure --prefix=$FLATPAK_DEST
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz
        sha256: f81f5860666b0bc7d84baddefa60d1cb9fa6fceb2398cc3baca6afaa60266675
  - name: edid-decode
    buildsystem: meson
    config-opts:
      - -Dudevdir=/app/lib/udev
      # Your previous options to disable the GUI tools:
      - -Dqv4l2=disabled
      - -Dqvidcap=disabled
      - -Ddoxygen-doc=disabled
  - name: dmidecode
    buildsystem: simple
    build-commands:
      - sed -i -e 's/ -O2/ -s -O2/' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install prefix=/ DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://download-mirror.savannah.gnu.org/releases/dmidecode/dmidecode-3.7.tar.xz
        sha256: 2c3aed12c85a1e6a9410d406d5e417c455466dc1bc7c89278bb32cf7cad91e8a
  - name: iproute2
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - install -D ./ip/ip $FLATPAK_DEST/sbin/ip
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.0.0.tar.xz
        sha256: e62890f7b5de63c05a3bf331dc8deb4c015c336013f341a4edf46969797f2f4e
  - name: lm-sensors
    buildsystem: simple
    build-commands:
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install BUILD_STATIC_LIB=0 DEBUG=0 PREFIX=/ DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://github.com/lm-sensors/lm-sensors/archive/V3-6-2.tar.gz
        sha256: c6a0587e565778a40d88891928bf8943f27d353f382d5b745a997d635978a8f0
  - name: libkmod
    buildsystem: simple
    build-commands:
      - ./configure --disable-debug --disable-python --disable-logging --disable-test-modules --disable-manpages --prefix=/
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
      - install -D ./tools/lsmod $FLATPAK_DEST/bin/lsmod
    sources:
      - type: archive
        url: https://cdn.kernel.org/pub/linux/utils/kernel/kmod/kmod-34.2.tar.xz
        sha256: 5a5d5073070cc7e0c7a7a3c6ec2a0e1780850c8b47b3e3892226b93ffcb9cb54
  - name: libusb-1
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-udev
    sources:
      - type: archive
        url: https://github.com/libusb/libusb/archive/v1.0.30.tar.gz
        sha256: 2ae28adb0bb9558c86135c4e1c11b320b0805461e207a64a6e520a114094bf07
  - name: usbutils
    buildsystem: meson
    post-install:
      # Replaces your manual binary patch for the usb.ids path
      - sed -i -e 's|/share/usb.ids|/var/tmp/P_USB|' /app/bin/lsusb
      # If you still want to exclude usbhid-dump from the final package,
      # simply remove it after the build finishes:
      - rm -f /app/bin/usbhid-dump
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/usb/usbutils/usbutils-019.tar.xz
        sha256: 659f40c440e31ba865c52c818a33d3ba6a97349e3353f8b1985179cb2aa71ec5
  - name: pciutils
    buildsystem: simple
    build-commands:
      - make install PREFIX=/ DESTDIR=$FLATPAK_DEST SHARED=no LIBKMOD=no HWDB=no ZLIB=no DNS=no
      - sed -i -e 's|/share/pci.ids|/var/tmp/P_PCI|' $FLATPAK_DEST/bin/lspci
    sources:
      - type: archive
        url: https://github.com/pciutils/pciutils/archive/v3.15.0.tar.gz
        sha256: 06f467642057599acf396bc17340452fac3308f1e08be19e0c32587e42d7017b
  - name: acpica-unix
    buildsystem: simple
    build-commands:
      # NOWERROR=TRUE prevents the _FORTIFY_SOURCE redefinition warning from failing the build
      - make NOWERROR=TRUE -j $FLATPAK_BUILDER_N_JOBS
      - make NOWERROR=TRUE install DESTDIR=$FLATPAK_DEST PREFIX=/
    sources:
      - type: archive
        url: https://github.com/acpica/acpica/releases/download/20260408/acpica-unix-20260408.tar.gz
        sha256: e66ceb26d6d514ce164fe22f5a4f7ca165cc38349d7a97f41a21f19b364647a2
  - name: hdparm
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install DESTDIR=`pwd`/INST
      - install -D INST/sbin/hdparm $FLATPAK_DEST/sbin/hdparm
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/hdparm-9.65.tar.gz
        sha256: d14929f910d060932e717e9382425d47c2e7144235a53713d55a94f7de535a4b
  - name: smartmontools
    buildsystem: simple
    build-commands:
      - NOCONFIGURE=1 sh autogen.sh
      - ./configure --with-nvme-devicescan --prefix=/ --with-systemdsystemunitdir=/share
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=$FLATPAK_DEST
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/smartmontools-7.5.tar.gz
        sha256: 690b83ca331378da9ea0d9d61008c4b22dde391387b9bbad7f29387f2595f76e
  - name: util-linux
    buildsystem: simple
    build-commands:
      - ./configure --prefix=/
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS dmesg
      - make -j $FLATPAK_BUILDER_N_JOBS lscpu
      - make -j $FLATPAK_BUILDER_N_JOBS lsblk
      - find . -type f | grep -v img.xz | perl -lne 'print if -B and -x' | xargs strip
      - install -D ./dmesg $FLATPAK_DEST/bin/dmesg
      - install -D ./lscpu $FLATPAK_DEST/bin/lscpu
      - install -D ./lsblk $FLATPAK_DEST/bin/lsblk
    sources:
      - type: archive
        url: https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.1.tar.xz
        sha256: 82e9158eb12a9b0b569d84e1687fed9dd18fe89ccd8ef5ac3427218a7c0d7f7f
  - name: libx86emu
    buildsystem: simple
    build-commands:
      - echo '3.5' > VERSION
      - rm -f git2log
      - sed -i -e 's/ -g / -s /' Makefile
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - make install DESTDIR=`pwd`/INST
      - cp -fr INST/usr/* $FLATPAK_DEST/
    sources:
      - type: archive
        url: https://github.com/wfeldt/libx86emu/archive/3.7.tar.gz
        sha256: 03754aede79530baa0e862e1aad5527e9c1bd3371736b1ab5a2bc769e4a3d680
  - name: lex
    buildsystem: simple
    build-commands:
      - NOCONFIGURE=1 sh autogen.sh
      - ./configure
      - make -j $FLATPAK_BUILDER_N_JOBS
      - install -D src/flex $FLATPAK_DEST/bin/lex
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.4/flex-20181004.tar.gz
        sha256: bd7d248de7792dd2de2089a16b7ea60f94b2056e721e1f0f1b28083f4792e902
  - name: perl-uri
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/URI-5.08.tar.gz
        sha256: 7e2c6fe3b1d5947da334fa558a96e748aaa619213b85bcdce5b5347d4d26c46e
  - name: perl-http-message
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/HTTP-Message-7.01.tar.gz
        sha256: 82b79ce680251045c244ee059626fecbf98270bed1467f0175ff5ea91071437e
  - name: perl-net-http
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/Net-HTTP-6.24.tar.gz
        sha256: 290ed9a97b05c7935b048e6d2a356035871fca98ad72c01c5961726adf85c83c
  - name: perl-try-tiny
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/Try-Tiny-0.32.tar.gz
        sha256: ef2d6cab0bad18e3ab1c4e6125cc5f695c7e459899f512451c8fa3ef83fa7fc0
  - name: perl-lwp-mediatypes
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GA/GAAS/LWP-MediaTypes-6.02.tar.gz
        sha256: 18790b0cc5f0a51468495c3847b16738f785a2d460403595001e0b932e5db676
  - name: perl-http-date
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GA/GAAS/HTTP-Date-6.02.tar.gz
        sha256: e8b9941da0f9f0c9c01068401a5e81341f0e3707d1c754f8e11f42a7e629e333
  - name: perl-timedate
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/G/GB/GBARR/TimeDate-2.30.tar.gz
        sha256: 75bd254871cb5853a6aa0403ac0be270cdd75c9d1b6639f18ecba63c15298e86
  - name: libwww-perl
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/E/ET/ETHER/libwww-perl-6.36.tar.gz
        sha256: 75c034ab4b37f4b9506dc644300697505582cf9545bcf2e2079e7263f675290a
  - name: perl-parent
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/C/CO/CORION/parent-0.244.tar.gz
        sha256: 149a65f019909c289714b57fb5c7cadba593e7b86ccf25cb49f7e54a2a1af1ce
  - name: perl-time-local
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/SITELIB/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/Time-Local-1.35.tar.gz
        sha256: 1d136b71bd041cbe6f66c43180ee79e675b72ad5a3596abd6a44d211072ada29
  - name: perl-data-dumper
    buildsystem: simple
    build-commands:
      - perl Makefile.PL
      - make install DESTDIR=`pwd`/INST INSTALLSITELIB=/SITELIB
      - chmod 777 -R ./INST
      - find ./INST -type f | perl -lne 'print if -B and -x' | xargs strip
      - mkdir -p $FLATPAK_DEST/share/perl5/
      - cp -fr ./INST/usr/lib/perl5/*/* $FLATPAK_DEST/share/perl5/
    sources:
      - type: archive
        url: https://cpan.metacpan.org/authors/id/S/SM/SMUELLER/Data-Dumper-2.161.tar.gz
        sha256: 3aa4ac1b042b3880438165fb2b2139d377564a8e9928ffe689ede5304ee90558
  - name: PyQt6
    buildsystem: simple
    build-commands:
      # Inject PYTHONPATH so the interpreter can find the 'sipbuild' and 'pyqtbuild' modules.
      # Point the target-dir explicitly into the writable /app sandbox.
      - PYTHONPATH=$FLATPAK_DEST/lib/python3.13/site-packages python3 -m sipbuild.tools.install --confirm-license --no-designer-plugin --no-qml-plugin --no-tools --concatenate=1 --no-docstrings --verbose --qt-shared --target-dir=$FLATPAK_DEST/lib/python3.13/site-packages --enable=QtCore --enable=QtGui --enable=QtWidgets
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/source/p/PyQt6/pyqt6-6.11.0.tar.gz
        sha256: 45dd60aa69976de1918b5ced6b4e7b6a25abd2a919ecef5fd5826ecc76718889
    modules:
      - name: python3-sip
        buildsystem: simple
        build-commands:
          - pip3 install --no-index --no-deps --prefix=$FLATPAK_DEST sip-6.15.3-py3-none-any.whl
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/0f/d9/36c6650bdb152d6089de179ceb94b71a862a0fa4af193fcf6ae09d4e2e19/sip-6.15.3-py3-none-any.whl
            sha256: 60df2ee1d17f5375dd15f92ed6181937fea3761e094b73ddfcc550991711e007
    modules:
      - name: PyQt-builder
        buildsystem: simple
        build-commands:
          - pip3 install --no-index --no-deps --prefix=$FLATPAK_DEST pyqt_builder-1.19.1-py3-none-any.whl
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/13/e8/3cdb96cd8f7f0bf4113532d5d762324dd6ea3630362ea2169f9075803a2e/pyqt_builder-1.19.1-py3-none-any.whl
            sha256: bb8a348479c25db54aa37542fcc98b6c28bb057c9dbac07ddf2424df2084951a
        cleanup:
          - "*"
        modules:
          - name: python-toml
            buildsystem: simple
            build-commands:
                - pip3 install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
            sources:
                - type: archive
                  url: https://files.pythonhosted.org/packages/source/t/toml/toml-0.10.2.tar.gz
                  sha256: b3bda1d108d5dd99f4a20d24d9c348e91c4db7ab1b749200bded2f839ccbe68f
  - name: python-packaging
    buildsystem: simple
    build-commands:
      # Install directly from the wheel without triggering a build backend
      - pip3 install --no-index --no-deps --prefix=$FLATPAK_DEST packaging-26.2-py3-none-any.whl
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/b2/87e62e8c3e2f4b32e5fe99e0b86d576da1312593b39f47d8ceef365e95ed/packaging-26.2-py3-none-any.whl
        sha256: 5fc45236b9446107ff2415ce77c807cee2862cb6fac22b8a73826d0693b0980e
    cleanup:
      - "*"
      - name: PyQt6_sip
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/source/p/PyQt6_sip/pyqt6_sip-13.11.1.tar.gz
            sha256: 869c5b48afe38e55b1ee0dd72182b0886e968cc509b98023ff50010b013ce1be
      - name: python-pyparsing
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-3.3.2.tar.gz
            sha256: c777f4d763f140633dcb6d8a3eda953bf7a214dc4eff598413c070bcdc117cbc
        cleanup:
          - "*"
      - name: PyQt-builder
        buildsystem: simple
        build-commands:
          - pip3 install --no-deps --no-build-isolation --prefix=$FLATPAK_DEST .
        sources:
          - type: archive
            url: https://files.pythonhosted.org/packages/source/p/PyQt-builder/pyqt_builder-1.19.1.tar.gz
            sha256: 6af6646ba29668751b039bfdced51642cb510e300796b58a4d68b7f956a024d8
        cleanup:
        - "*"
  - name: hwinfo
    skip-arches:
      - aarch64
      - arm
    buildsystem: simple
    build-commands:
      - echo '22.1' > VERSION
      - rm -f git2log
      - sed -i -e 's/ -g / -s /' Makefile.common
      - CFLAGS='-I'$FLATPAK_DEST'/include' LDFLAGS='-L'$FLATPAK_DEST'/lib64 -L'$FLATPAK_DEST'/lib -lx86emu' LD_LIBRARY_PATH=$FLATPAK_DEST'/lib64:'$FLATPAK_DEST'/lib' make
      - make install DESTDIR=`pwd`/INST
      - cp -fr INST/usr/* $FLATPAK_DEST/
    sources:
      - type: archive
        url: https://github.com/openSUSE/hwinfo/archive/25.4.tar.gz
        sha256: 7209dc18874c206fa2de85fd2ea78ca328a2435258ec24dcb512578d36796188
  - name: hwinfo
    only-arches:
      - aarch64
      - arm
    buildsystem: simple
    build-commands:
      - echo '22.1' > VERSION
      - rm -f git2log
      - sed -i -e 's/ -g / -s /' Makefile.common
      - make
      - make install DESTDIR=`pwd`/INST
      - cp -fr INST/usr/* $FLATPAK_DEST/
    sources:
      - type: archive
        url: https://github.com/openSUSE/hwinfo/archive/25.4.tar.gz
        sha256: 7209dc18874c206fa2de85fd2ea78ca328a2435258ec24dcb512578d36796188
  - name: hw-probe
    buildsystem: simple
    build-commands:
      - make install DESTDIR=$FLATPAK_DEST prefix=/
      - mv $FLATPAK_DEST/bin/hw-probe $FLATPAK_DEST/bin/hw-probe-flatpak
      - install -m 777 -D flatpak/hw-probe.sh $FLATPAK_DEST/bin/hw-probe
      - install -D flatpak/PERL5_BASE $FLATPAK_DEST/share/PERL5_BASE
      - install -D flatpak/hw-probe.appdata.xml $FLATPAK_DEST/share/metainfo/org.linux_hardware.hw-probe.appdata.xml
      - install -D flatpak/icon-256x256.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/org.linux_hardware.hw-probe.png
      - install -D flatpak/icon-128x128.png $FLATPAK_DEST/share/icons/hicolor/128x128/apps/org.linux_hardware.hw-probe.png
      - install -D flatpak/icon-64x64.png $FLATPAK_DEST/share/icons/hicolor/64x64/apps/org.linux_hardware.hw-probe.png
      - install -D flatpak/hw-probe.desktop $FLATPAK_DEST/share/applications/org.linux_hardware.hw-probe.desktop
      - install -D flatpak/usb.ids $FLATPAK_DEST/share/usb.ids
      - install -D flatpak/pci.ids $FLATPAK_DEST/share/pci.ids
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/hw-probe-1.6-AI.tar.gz
        sha256: 4855a49a42c0ebe4cdadd8fd2217137d6f3643a662ad3b7c1f34a5c1b61859d2
  - name: hw-probe-pyqt6-gui
    buildsystem: simple
    build-commands:
      - mkdir -p $FLATPAK_DEST/share/hw-probe-pyqt6-gui/
      - mv Resources Hardware\ Probe $FLATPAK_DEST/share/hw-probe-pyqt6-gui/
      - ln -s $FLATPAK_DEST/share/hw-probe-pyqt6-gui/Hardware\ Probe $FLATPAK_DEST/bin/hw-probe-pyqt6-gui
      - chmod 777 $FLATPAK_DEST/bin/hw-probe-pyqt6-gui
    sources:
      - type: archive
        url: https://github.com/linuxhw/build-stuff/releases/download/1.6/hw-probe-pyqt6-gui-1.0-AI.tar.gz
        sha256: 3a0a09d486a3b813397689e7de2df84b3132e7dab3d6dcda76cc19298b082c9c
  - name: perl-base
    buildsystem: simple
    build-commands:
      - sh Configure -de -Dprefix=/
      - make -j $FLATPAK_BUILDER_N_JOBS
      - find . -type f | perl -lne 'print if -B and -x' | xargs strip
      - install -D ./perl $FLATPAK_DEST/bin/perl
      - cd lib && cat $FLATPAK_DEST/share/PERL5_BASE | while read i; do mkdir -p $FLATPAK_DEST/share/perl5/`dirname $i`; cp -fr $i $FLATPAK_DEST/share/perl5/$i; done
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.43.10.tar.xz
        sha256: 28a8eb6191fc7cbd2ccb1eab49001e2740fb8afb6e79811ca18b624f6523086c
